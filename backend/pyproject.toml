[project]
name = "mp3editor"
version = "0.1.0"
description = "Edit a song's tags, cover art and ending; save MP3s in place or convert to M4A."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mutagen>=1.47.0",
    "pywebview>=6.2.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
mp3editor = "mp3editor.__main__:main"

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
addopts = "-q"
