<!-- Full-bleed on purpose: macOS 26 clips app icons to its own rounded square, and puts art with transparent
     margins on a white plate. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.58" r="0.42">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#4c1d95" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e4d8ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#000"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g transform="translate(160 150) scale(22)">
    <path d="M16 2c1 5 7 8 7 16a7 7 0 0 1-14 0c0-4 2-6 3-8 0 3 1 5 3 5-1-5 0-9 1-13Z" fill="url(#flame)"/>
    <path d="M16 17c2 2 3 3 3 5a3 3 0 0 1-6 0c0-2 1-3 3-5Z" fill="#f5f0ff" opacity="0.9"/>
  </g>
</svg>
